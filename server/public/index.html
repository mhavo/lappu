<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">

    <title>Lappu</title>

    <script src="https://cdn.jsdelivr.net/npm/hash-wasm@4.12.0/dist/argon2.umd.min.js" integrity="sha384-tP0Wy54CKmng7i9EoTlPySD0hBx6Octj0VS6MfwlnUu111MPa+JLm0CCbep6XJ1W" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js" integrity="sha384-RH2xi4eIQ/gjtbs9fUXM68sLSi99C7ZWBRX1vDrVv6GQXRibxXLbwO2NGZB74MbU" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/languages/latex.min.js" integrity="sha384-A8E38+eenPg19mMk5Ikv1fetaPL/yA2OsGR3hFs9TeeBX+zQ8u5bZNsPKmlFHwN4" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" integrity="sha384-cpW21h6RZv/phavutF+AuVYrr+dA8xD9zs6FwLpaCct6O9ctzYFfFr4dgmgccOTx" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/mhchem.min.js" integrity="sha384-ifpG+NlgMq0kvOSGqGQxW1mJKpjjMDmZdpKGq3tbvD3WPhyshCEEYClriK/wRVU0" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js" integrity="sha384-tzkLtoItq5nn9rQVHE/dKGZmMnvCdc62hJPgq7WotRHBFtSXJeRB6DU3zKSV6bDy" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/texmath.min.js" integrity="sha384-IJTt8+6hpcfxunTzDwSuS8o8lsOFjDwoUddKsTvs+x8oa9muA1PbBBcXaz8D6yR0" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/markdown-it-footnote@3.0.3/dist/markdown-it-footnote.min.js" integrity="sha384-8GI+PzQqDMS2g58dN0NG07YRb9MdbArEZbvnE6BVFzI6JCZLMurPzOHb1Ttdy8Li" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-checkbox@1.1.0/dist/markdown-it-checkbox.min.js" integrity="sha384-mqP2OImp5gvfOsXL630fBCJUB0czB1eKzPyvseWne61BIvY/s6P9kOXdtAmqSqOX" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=JetBrains+Mono&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" integrity="sha384-GvrOXuhMATgEsSwCs4smul74iXGOixntILdUW9XmUC6+HX0sLNAK3q71HotJqlAn" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github.min.css" integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L" crossorigin="anonymous" media="not (prefers-color-scheme: dark)">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="/favicon.ico">
</head>

<body>
    <div class="content">
        <div id="attachment-status" role="status"></div>
        <div id="note-tools" class="note-tools" hidden>
            <span class="split-button">
                <button type="button" class="copy-note"><span class="copy-icon" aria-hidden="true">⧉</span> <span class="copy-note-label"></span></button><button type="button" class="copy-more caret" aria-haspopup="menu" aria-expanded="false" aria-controls="copy-menu"><span aria-hidden="true">▾</span></button>
            </span>
            <div id="copy-menu" class="copy-menu" role="menu" hidden>
                <button type="button" role="menuitem" data-format="markdown" class="copy-as-markdown"></button>
                <button type="button" role="menuitem" data-format="plain" class="copy-as-plain"></button>
                <button type="button" role="menuitem" data-format="html" class="copy-as-html"></button>
                <div class="menu-separator" role="separator"></div>
                <button type="button" role="menuitem" data-action="obsidian-new" class="add-to-obsidian"></button>
                <button type="button" role="menuitem" data-action="obsidian-daily" class="add-to-daily-note"></button>
                <button type="button" role="menuitem" data-action="download" class="download-markdown"></button>
            </div>
        </div>
        <div id="main"></div>
        <div id="note-end" hidden>
            <div class="note-end-ornament" aria-hidden="true">· · ·</div>
            <div id="note-footer"></div>
            <div id="note-tools-bottom" class="note-tools at-bottom">
                <span class="split-button">
                    <button type="button" class="copy-note"><span class="copy-icon" aria-hidden="true">⧉</span> <span class="copy-note-label"></span></button><button type="button" class="copy-more caret" aria-haspopup="menu" aria-expanded="false" aria-controls="copy-menu-bottom"><span aria-hidden="true">▾</span></button>
                </span>
                <div id="copy-menu-bottom" class="copy-menu" role="menu" hidden>
                    <button type="button" role="menuitem" data-format="markdown" class="copy-as-markdown"></button>
                    <button type="button" role="menuitem" data-format="plain" class="copy-as-plain"></button>
                    <button type="button" role="menuitem" data-format="html" class="copy-as-html"></button>
                    <div class="menu-separator" role="separator"></div>
                    <button type="button" role="menuitem" data-action="obsidian-new" class="add-to-obsidian"></button>
                    <button type="button" role="menuitem" data-action="obsidian-daily" class="add-to-daily-note"></button>
                    <button type="button" role="menuitem" data-action="download" class="download-markdown"></button>
                </div>
            </div>
        </div>
        <div id="copy-status" role="status"></div>
        <div id="footer">
            <span id="language-select" role="group"><button type="button" data-lang="fi" lang="fi">FI</button> / <button type="button" data-lang="en" lang="en">EN</button></span> · <span id="app-name">Lappu</span>
        </div>
        <script src="/viewer-lib.js"></script>
        <script src="/i18n.js"></script>
        <script src="/index.js"></script>
    </div>
</body>

</html>
